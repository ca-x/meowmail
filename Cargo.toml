[package]
name = "meowmail"
version = "0.7.3"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "妙邮 / Meowmail — a self-hosted multi-account Web mail client"
repository = "https://github.com/ca-x/meowmail"

[dependencies]
ammonia = "4.1.2"
anyhow = "1.0.100"
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.8", features = ["json", "macros"] }
base64 = "0.23.0"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
cookie = "0.18.1"
futures-util = "0.3.31"
claude-sdk = "2.1.0"
fast-dav-rs = "0.4.4"
gemini-rust = "2.0.0"
lunar_rust = "1.0.1"
mail-builder = "0.4.4"
mail-parser = { version = "0.11.5", features = ["full_encoding"] }
mime_guess = "2.0.5"
openidconnect = "4.0.1"
openai_rust_sdk = "1.4.2"
pinyin = { version = "0.11.0", default-features = false, features = ["plain"] }
rand = "0.10.2"
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls", "socks"] }
reqwest12 = { package = "reqwest", version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "socks"] }
rust-embed = "8.8.0"
sea-orm = { version = "2.0.0", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-sqlite", "with-time"] }
sea-orm-migration = { version = "2.0.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
shell-words = "1.1.1"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-gzip", "limit", "trace"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
url = "2.5.7"
uuid = { version = "1.19.0", features = ["serde", "v4"] }
webpki-roots = "1.0.4"
zeroize = "1.8.2"

[dev-dependencies]
chrono = "0.4.42"
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
